<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AC Repair Pro</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial;
}

body {
  background: #0f172a;
  color: white;
  overflow-x: hidden;
}

/* NAV */
nav {
  display: flex;
  justify-content: space-between;
  padding: 20px 40px;
  position: fixed;
  width: 100%;
  top: 0;
  background: rgba(0,0,0,0.3);
  backdrop-filter: blur(10px);
}

/* HERO */
.hero {
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  background: radial-gradient(circle at top, #1e3a8a, #0f172a);
}

.hero h1 {
  font-size: 50px;
  animation: fadeDown 1s ease;
}

.hero p {
  margin-top: 10px;
  opacity: 0.8;
  animation: fadeDown 1.2s ease;
}

.btn {
  margin-top: 20px;
  padding: 12px 25px;
  border: none;
  background: #3b82f6;
  color: white;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.3s;
}

.btn:hover {
  transform: scale(1.1);
  background: #2563eb;
}

/* SECTIONS */
.section {
  padding: 80px 40px;
}

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
}

.card {
  background: rgba(255,255,255,0.05);
  padding: 20px;
  border-radius: 15px;
  transition: 0.3s;
  transform: translateY(30px);
  opacity: 0;
}

.card.show {
  transform: translateY(0);
  opacity: 1;
}

.card:hover {
  transform: scale(1.05);
  background: rgba(255,255,255,0.1);
}

/* ANIMATION */
@keyframes fadeDown {
  from { opacity: 0; transform: translateY(-20px); }
  to { opacity: 1; transform: translateY(0); }
}

</style>
</head>

<body>

<nav>
  <div>❄ AC Repair Pro</div>
  <div>📞 (555) 123-4567</div>
</nav>

<section class="hero">
  <h1>Fast AC Repair</h1>
  <p>Professional HVAC service 24/7</p>
  <button class="btn">Call Now</button>
</section>

<section class="section">
  <h2>Services</h2>
  <div class="cards">
    <div class="card">AC Repair</div>
    <div class="card">Installation</div>
    <div class="card">Maintenance</div>
    <div class="card">Emergency</div>
  </div>
</section>

<script>
const cards = document.querySelectorAll(".card");

window.addEventListener("scroll", () => {
  cards.forEach(card => {
    const top = card.getBoundingClientRect().top;
    if(top < window.innerHeight - 100){
      card.classList.add("show");
    }
  });
});
</script>

</body>
</html>
